    }

    function renderClientDetail(clientId){
      const c=clients.find(x=>x.id===clientId);if(!c){setPage('clients');return}const v=clientVisual(c.name);
      const ctasks=tasks.filter(t=>t.client_id===clientId);
      const pending=ctasks.filter(t=>!isDone(t)&&t.status!=='cancelled');
      const overdue=pending.filter(isOverdue);
      const completed=ctasks.filter(isDone).slice(-5).reverse();
      const ccontent=contents.filter(x=>x.client_id===clientId);
      const upcoming=ccontent.filter(x=>x.status!=='published'&&x.status!=='skipped').sort((a,b)=>new Date(a.scheduled_at||'2999')-new Date(b.scheduled_at||'2999'));
      const calendarHtml=upcoming.length?upcoming.map(x=>{const d=x.scheduled_at?new Date(x.scheduled_at):null;return `<div class="card calendar-item" data-edit-content="${x.id}" style="--accent:${v.a};--soft:${v.soft}"><div class="datebox">${d?`<span>${escapeHtml(new Intl.DateTimeFormat('en-IN',{month:'short'}).format(d))}</span><b>${d.getDate()}</b><span>${escapeHtml(new Intl.DateTimeFormat('en-IN',{weekday:'short'}).format(d))}</span>`:'<b>–</b><span>TBD</span>'}</div><div><div class="title">${escapeHtml(x.title)}</div><div class="meta"><span class="pill">${escapeHtml(x.content_type)}</span><span class="pill ${x.status==='published'?'green':'blue'}">${escapeHtml(x.status)}</span></div>${x.notes&&!dateOnlyContent(x)?`<div class="subtle">${escapeHtml(x.notes)}</div>`:''}<div class="content-actions"><button class="ai-btn" type="button" data-chatgpt-content="${x.id}">✦ Create with ChatGPT</button><button class="small-btn" type="button" data-edit-content-btn="${x.id}">Edit</button></div></div></div>`}).join(''):`<div class="empty"><b>No dated content loaded</b>${c.name==='BrainyBots'?'Your weekly BrainyBots content plan still needs to be prepared.':'Add the next post to start this calendar.'}</div>`;
      main.innerHTML=`<button class="backbtn" id="backClients">← All clients</button><section class="client-hero" style="--accent:${v.a};--accent2:${v.b}"><div class="client-hero-top"><div class="client-icon3d">${iconSvg(v.icon)}</div><div><h2>${escapeHtml(c.name)}</h2><p>${escapeHtml(c.workstream||'')} · ${escapeHtml(c.platform||'')}</p></div></div></section><div class="stats"><div class="stat"><div class="stat-line"><div class="stat-icon">${iconSvg('pin')}</div><div class="stat-copy"><div class="stat-value">${pending.length}</div><div class="stat-label">Pending</div></div></div><div class="stat-detail">${pending.length?`${pending.length} open task${pending.length===1?'':'s'} for this client.`:'No pending tasks.'}</div></div><div class="stat"><div class="stat-line"><div class="stat-icon">${iconSvg('calendar')}</div><div class="stat-copy"><div class="stat-value">${upcoming.length}</div><div class="stat-label">Upcoming posts</div></div></div><div class="stat-detail">${upcoming.length?`${upcoming.length} scheduled content item${upcoming.length===1?'':'s'}.`:'Nothing scheduled yet.'}</div></div><div class="stat"><div class="stat-line"><div class="stat-icon">${iconSvg('clock')}</div><div class="stat-copy"><div class="stat-value">${overdue.length}</div><div class="stat-label">Overdue</div></div></div><div class="stat-detail">${overdue.length?`${overdue.length} overdue item${overdue.length===1?'':'s'} to fix.`:'No overdue work.'}</div></div></div><div class="client-actions"><button class="primary" id="clientAddTask">+ Task</button><button class="secondary" id="clientAddContent">+ Content</button></div><section class="section"><div class="section-head"><h3>Content calendar</h3></div>${calendarHtml}</section><section class="section"><div class="section-head"><h3>Pending work (${pending.length})</h3></div>${pending.length?pending.map(taskCard).join(''):`<div class="empty"><b>Nothing pending</b>This client is clear.</div>`}</section>${completed.length?`<section class="section"><div class="section-head"><h3>Recently completed</h3></div>${completed.map(taskCard).join('')}</section>`:''}`;
      $('#backClients').onclick=()=>setPage('clients');
      $('#clientAddTask').onclick=()=>openTaskModal(null,{client_id:c.id});
      $('#clientAddContent').onclick=()=>openContentModal(null,null,c.id);
      bindContentActions();bindTaskActions();
    }

    function renderSettings(){
      main.innerHTML=`<div class="page-title"><h2>Settings</h2></div><div class="settings-card"><h3>Phone reminders</h3><p>Allow TAAZ to show reminders while the app is running. Full background push reminders can be added later without changing your task data.</p><button id="notifyBtn" class="secondary">Enable notifications</button></div><div class="settings-card"><h3>Daily briefing</h3><p>Your preferred daily planning time is 10:00 AM (India time). The app builds your brief automatically from your tasks and content schedule.</p><button id="copyBriefSettings" class="secondary">Copy today's brief</button></div><div class="settings-card"><h3>Account</h3><p>${escapeHtml(user?.email||'')}</p><button id="signOut" class="danger">Sign out</button></div>`;
      $('#notifyBtn').onclick=requestNotifications;$('#copyBriefSettings').onclick=copyBrief;$('#signOut').onclick=async()=>{await supabase.auth.signOut()};
    }

    function bindTaskActions(){
      $$('[data-complete]').forEach(b=>b.onclick=async()=>{const t=tasks.find(x=>x.id===b.dataset.complete);const done=!isDone(t);await supabase.from('tasks').update({status:done?'done':'todo',completed_at:done?new Date().toISOString():null,updated_at:new Date().toISOString()}).eq('id',t.id);await refreshData();render()});
      $$('[data-edit-task]').forEach(b=>b.onclick=()=>openTaskModal(tasks.find(t=>t.id===b.dataset.editTask)));
    }

    function openModal(html){sheet.innerHTML=html;modal.classList.remove('hidden');sheet.querySelector('[data-close]')?.addEventListener('click',closeModal)}
    function closeModal(){modal.classList.add('hidden');sheet.innerHTML=''}
    modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});

    function defaultLocalDateTime(iso){if(!iso)return {date:todayKey(),time:''};const d=new Date(iso);return {date:localDateKey(d),time:`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}}
    function makeIso(date,time){if(!date)return null;const d=new Date(`${date}T${time||'23:59'}:00`);return isNaN(d)?null:d.toISOString()}

    function openTaskModal(existing=null,prefill={}){
      const dt=defaultLocalDateTime(existing?.due_at);const rem=defaultLocalDateTime(existing?.reminder_at);
      openModal(`<div class="sheethead"><h3>${existing?'Edit':'Add'} task</h3><button class="x" data-close>×</button></div><form id="taskForm">
        <div class="field"><label>Client / work area</label><select id="taskClient"><option value="">General</option>${clients.map(c=>`<option value="${c.id}" ${(existing?.client_id||prefill.client_id)===c.id?'selected':''}>${escapeHtml(c.name)}</option>`).join('')}</select></div>
        <div class="field"><label>Task</label><input id="taskTitle" required value="${escapeHtml(existing?.title||prefill.title||'')}" placeholder="e.g. Create Dr Deepthi carousel"></div>
        <div class="grid2"><div class="field"><label>Due date</label><input id="taskDate" type="date" value="${existing?dt.date:(prefill.date||todayKey())}"></div><div class="field"><label>Due time</label><input id="taskTime" type="time" value="${existing?dt.time:(prefill.time||'')}"></div></div>
        <div class="field"><label>Priority</label><select id="taskPriority">${['low','medium','high','urgent'].map(p=>`<option value="${p}" ${(existing?.priority||prefill.priority||'medium')===p?'selected':''}>${p[0].toUpperCase()+p.slice(1)}</option>`).join('')}</select></div>
        <div class="grid2"><div class="field"><label>Reminder date (optional)</label><input id="remDate" type="date" value="${existing?.reminder_at?rem.date:''}"></div><div class="field"><label>Reminder time</label><input id="remTime" type="time" value="${existing?.reminder_at?rem.time:''}"></div></div>
        <div class="field"><label>Notes (optional)</label><textarea id="taskDesc">${escapeHtml(existing?.description||'')}</textarea></div>
        <div class="actions">${existing?'<button id="deleteTask" type="button" class="danger">Delete</button>':''}<button type="submit" class="primary">${existing?'Save changes':'Add task'}</button></div></form>`);
      $('#taskForm').onsubmit=async e=>{e.preventDefault();const payload={user_id:user.id,client_id:$('#taskClient').value||null,title:$('#taskTitle').value.trim(),description:$('#taskDesc').value.trim()||null,priority:$('#taskPriority').value,due_at:makeIso($('#taskDate').value,$('#taskTime').value),reminder_at:$('#remDate').value?makeIso($('#remDate').value,$('#remTime').value):null,status:existing?.status||'todo',source:prefill.source||existing?.source||'manual',updated_at:new Date().toISOString()};let res=existing?await supabase.from('tasks').update(payload).eq('id',existing.id):await supabase.from('tasks').insert(payload);if(res.error){showToast(res.error.message);return}closeModal();await refreshData();render();showToast(existing?'Task updated':'Task added')};
      if(existing)$('#deleteTask').onclick=async()=>{if(confirm('Delete this task?')){await supabase.from('tasks').delete().eq('id',existing.id);closeModal();await refreshData();render();showToast('Task deleted')}};
    }

    function openContentModal(prefillDate=null,existing=null,prefillClientId=null){
      const dt=defaultLocalDateTime(existing?.scheduled_at);
      const typeOptions=[...new Set(['Post','Reel','Carousel','Story','LinkedIn Post','Video','Doctor Reel','Parent Reel','Emergency Reel','Trust Reel','Founder Note','CEO POV',existing?.content_type].filter(Boolean))];
      openModal(`<div class="sheethead"><h3>${existing?'Edit':'Schedule'} content</h3><button class="x" data-close>×</button></div><form id="contentForm">
        <div class="field"><label>Client / work area</label><select id="contentClient" required>${clients.map(c=>`<option value="${c.id}" ${(existing?.client_id||prefillClientId)===c.id?'selected':''}>${escapeHtml(c.name)}</option>`).join('')}</select></div>
        <div class="grid2"><div class="field"><label>Platform</label><select id="contentPlatform">${['Instagram','LinkedIn','Facebook','Other'].map(p=>`<option ${existing?.platform===p?'selected':''}>${p}</option>`).join('')}</select></div><div class="field"><label>Content type</label><select id="contentType">${typeOptions.map(p=>`<option ${existing?.content_type===p?'selected':''}>${escapeHtml(p)}</option>`).join('')}</select></div></div>
        <div class="field"><label>Topic / title</label><input id="contentTitle" required value="${escapeHtml(existing?.title||'')}" placeholder="e.g. Ear health carousel"></div>
        <div class="field"><label>Hook (optional)</label><input id="contentHook" value="${escapeHtml(existing?.hook||'')}"></div>
        <div class="grid2"><div class="field"><label>Schedule date</label><input id="contentDate" type="date" value="${existing?dt.date:(prefillDate||todayKey())}"></div><div class="field"><label>Time</label><input id="contentTime" type="time" value="${existing?dt.time:''}"></div></div>
        <div class="field"><label>Status</label><select id="contentStatus">${['idea','drafting','ready','scheduled','published','skipped'].map(s=>`<option value="${s}" ${(existing?.status||'idea')===s?'selected':''}>${s[0].toUpperCase()+s.slice(1)}</option>`).join('')}</select></div>
        <div class="field"><label>Notes / caption draft (optional)</label><textarea id="contentNotes">${escapeHtml(existing?.notes||existing?.caption||'')}</textarea></div>
        <div class="actions">${existing?'<button id="deleteContent" type="button" class="danger">Delete</button>':''}<button type="submit" class="primary">${existing?'Save changes':'Schedule content'}</button></div></form>`);
      $('#contentForm').onsubmit=async e=>{e.preventDefault();const status=$('#contentStatus').value;const payload={user_id:user.id,client_id:$('#contentClient').value,platform:$('#contentPlatform').value,content_type:$('#contentType').value,title:$('#contentTitle').value.trim(),hook:$('#contentHook').value.trim()||null,notes:$('#contentNotes').value.trim()||null,scheduled_at:makeIso($('#contentDate').value,$('#contentTime').value),status,published_at:status==='published'?(existing?.published_at||new Date().toISOString()):null,updated_at:new Date().toISOString()};let res=existing?await supabase.from('content_schedule').update(payload).eq('id',existing.id):await supabase.from('content_schedule').insert(payload);if(res.error){showToast(res.error.message);return}closeModal();await refreshData();render();showToast(existing?'Content updated':'Content scheduled')};
      if(existing)$('#deleteContent').onclick=async()=>{if(confirm('Delete this content item?')){await supabase.from('content_schedule').delete().eq('id',existing.id);closeModal();await refreshData();render();showToast('Content deleted')}};
    }

    function parseVoice(text){
      let raw=text.trim(), lower=raw.toLowerCase(), client_id=null;
      const map=[['deepthi','Dr Deepthi'],['zuven','ZUVEN Tech'],['vishnu','Vishnu LinkedIn'],['praveen','Praveen LinkedIn'],['brainybots','BrainyBots'],['brainy bots','BrainyBots'],['qubisec','Qubisec']];
      for(const [key,name] of map){if(lower.includes(key)){client_id=clients.find(c=>c.name===name)?.id||null;break}}
      let date=todayKey();if(/\btomorrow\b/.test(lower))date=tomorrowKey();
      const days=['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];for(let i=0;i<days.length;i++){if(lower.includes(days[i])){let d=new Date(),delta=(i-d.getDay()+7)%7||7;d.setDate(d.getDate()+delta);date=localDateKey(d);break}}
      let time='';const m=lower.match(/(?:at|by)?\s*(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b/);if(m){let h=Number(m[1]),min=Number(m[2]||0);if(m[3]==='pm'&&h<12)h+=12;if(m[3]==='am'&&h===12)h=0;time=`${String(h).padStart(2,'0')}:${String(min).padStart(2,'0')}`}
      let title=raw.replace(/\b(today|tomorrow|sunday|monday|tuesday|wednesday|thursday|friday|saturday)\b/ig,'').replace(/(?:at|by)?\s*\d{1,2}(?::\d{2})?\s*(am|pm)\b/ig,'').replace(/\s+/g,' ').trim();
      return {title,date,time,client_id,source:'voice'};
    }

    function startVoiceTask(){
      const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){showToast('Voice entry is not supported in this browser. Try Chrome on your Samsung phone.');return}
      const r=new SR();r.lang='en-IN';r.interimResults=false;r.maxAlternatives=1;showToast('Listening… say the task, client and time');
      r.onresult=e=>{const text=e.results[0][0].transcript;showToast(`Heard: ${text}`);openTaskModal(null,parseVoice(text))};r.onerror=()=>showToast('I could not hear that. Please try again.');r.start();
    }

    function makeDailyBrief(){
      const over=tasks.filter(isOverdue);const due=tasks.filter(t=>isToday(t)&&!isDone(t));const posts=contents.filter(c=>c.scheduled_at&&localDateKey(c.scheduled_at)===todayKey()&&c.status!=='published'&&c.status!=='skipped');
      let lines=[`TODAY: ${due.length} task${due.length===1?'':'s'}, ${posts.length} content item${posts.length===1?'':'s'}, ${over.length} overdue.`];
      if(over.length){lines.push('\nOVERDUE');over.slice(0,5).forEach((t,i)=>lines.push(`${i+1}. ${clientName(t.client_id)} — ${t.title}`))}
      if(due.length){lines.push('\nDUE TODAY');due.slice(0,7).forEach((t,i)=>lines.push(`${i+1}. ${clientName(t.client_id)} — ${t.title}${t.due_at?' — '+taskWhen(t):''}`))}
      if(posts.length){lines.push('\nCONTENT TODAY');posts.slice(0,7).forEach((c,i)=>lines.push(`${i+1}. ${clientName(c.client_id)} — ${c.title}${c.scheduled_at?' — '+contentWhen(c):''}`))}
      if(!over.length&&!due.length&&!posts.length)lines.push('\nNo scheduled work yet. Add your next task or content item.');
      return lines.join('\n');
    }
    async function copyBrief(){const text=`I am using my TAAZ Marketing Agent. Here is my current daily work brief:\n\n${makeDailyBrief()}\n\nPlease prioritise this work for me and tell me what I should do first.`;try{await navigator.clipboard.writeText(text);showToast('Copied. Paste this into ChatGPT.')}catch{showToast('Copy was blocked by the browser.')}}

    async function requestNotifications(){if(!('Notification'in window)){showToast('Notifications are not supported here.');return}const p=await Notification.requestPermission();showToast(p==='granted'?'Notifications enabled':'Notifications were not enabled')}
    async function showNotification(title,body,tag){if(Notification.permission!=='granted')return;try{const reg=await navigator.serviceWorker.ready;await reg.showNotification(title,{body,tag,icon:'./icon-192.png',badge:'./icon-192.png'})}catch(e){}}
    async function checkReminders(){if(!user||Notification.permission!=='granted')return;const seen=JSON.parse(localStorage.getItem('taazNotified')||'{}');const now=Date.now();for(const t of tasks){if(t.reminder_at&&!isDone(t)){const tm=new Date(t.reminder_at).getTime();if(tm<=now&&now-tm<10*60*1000&&!seen[`t:${t.id}`]){await showNotification('TAAZ task reminder',`${clientName(t.client_id)} — ${t.title}`,`task-${t.id}`);seen[`t:${t.id}`]=now}}}for(const c of contents){if(c.reminder_at&&c.status!=='published'&&c.status!=='skipped'){const tm=new Date(c.reminder_at).getTime();if(tm<=now&&now-tm<10*60*1000&&!seen[`c:${c.id}`]){await showNotification('TAAZ content reminder',`${clientName(c.client_id)} — ${c.title}`,`content-${c.id}`);seen[`c:${c.id}`]=now}}}localStorage.setItem('taazNotified',JSON.stringify(seen))}

    $('#authSwitch').onclick=()=>{authMode=authMode==='signin'?'signup':'signin';$('#authSubmit').textContent=authMode==='signin'?'Sign in':'Create account';$('#authSwitch').textContent=authMode==='signin'?'New here? Create my private account':'Already created it? Sign in';$('#authSubtitle').textContent=authMode==='signin'?"Your private marketing work desk. Sign in to see today's client tasks and content.":'Create your private login once. You can then use the same account on your Samsung phone and laptop.';$('#authMessage').classList.add('hidden')};
    $('#authForm').onsubmit=async e=>{e.preventDefault();const email=$('#authEmail').value.trim(),password=$('#authPassword').value;$('#authSubmit').disabled=true;$('#authSubmit').textContent='Please wait…';let result;if(authMode==='signin') result=await supabase.auth.signInWithPassword({email,password}); else result=await supabase.auth.signUp({email,password,options:{emailRedirectTo:window.location.href}});$('#authSubmit').disabled=false;$('#authSubmit').textContent=authMode==='signin'?'Sign in':'Create account';const box=$('#authMessage');box.classList.remove('hidden');if(result.error){box.textContent=result.error.message;return}if(authMode==='signup'&&!result.data.session){box.textContent='Account created. Please check your email and confirm the sign-in link, then return here.'}else box.textContent='Signed in.'};

    init();
  </script>
